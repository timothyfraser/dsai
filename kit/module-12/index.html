<!doctype html>
<!--
  index.html
  The page the browser loads first: an empty box for React to fill, and the page's colours.
  Course kit, module 12

  Run it on your laptop, from this folder (kit/module-12/):
    npm install
    VITE_API_URL=https://your-team-api.example.org/ask npm run dev
  then open the address Vite prints (usually http://localhost:5173/).
  For a folder of plain files to put on a server: npm run build (they land in dist/).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this line a phone draws the page at desktop width and shrinks it to fit. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the team system</title>
<style>
  /* 1. COLOURS: one set of tokens, light and dark. Text on paper passes 4.5 to 1 contrast in both. */
  :root { --ink: #1d1b33; --muted: #4a4f5c; --paper: #f7f8f5; --line: #8a919c; --accent: #3a3878; --bad: #9b1c1c; --focus: #b35c00; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e9ebf0; --muted: #b9bfcc; --paper: #15141f; --line: #6d7385; --accent: #b4b1ff; --bad: #ff9c9c; --focus: #ffb35c; } }
  * { box-sizing: border-box; }
  body { margin: 0 auto; padding: 16px; max-width: 640px; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .hint, .src { color: var(--muted); overflow-wrap: anywhere; }
  .src.missing { color: var(--bad); }
  label { display: block; font-weight: 600; margin-top: 16px; }
  /* 2. A PHONE SCREEN: the row wraps instead of pushing the page sideways; touch targets are 44 px tall. */
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
  input { flex: 1 1 12rem; min-width: 0; min-height: 44px; padding: 10px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { min-height: 44px; padding: 10px 16px; font: inherit; border: 0; border-radius: 6px; background: var(--accent); color: var(--paper); }
  button:disabled { opacity: .6; }
  /* 3. KEYBOARD: never remove the focus ring; make it easier to see instead. */
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #answer { padding: 12px; border: 1px solid var(--line); border-radius: 6px; }
  #answer p { margin: 0 0 6px; }
  #error { padding: 12px; border: 2px solid var(--bad); border-radius: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
